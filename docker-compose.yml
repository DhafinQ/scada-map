version: '3.8'

services:
  scada-map:
    build: .
    container_name: scada-map-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Mount config.json agar perubahan dari web UI tersimpan di host
      - ./config.json:/app/config.json
    extra_hosts:
      # Memungkinkan container mengakses MySQL yang berjalan di host mesin
      - "host.docker.internal:host-gateway"